spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  application:
    name: uniconnect

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uniconnect}
    username: ${DB_USERNAME:uniconnect}
    password: ${DB_PASSWORD:}
    hikari:
      # Retire stale remote connections before they reach the lifetime seen in
      # development logs, and let the pool grow on demand while the app is idle.
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:60000}
      keepalive-time: ${DB_POOL_KEEPALIVE_TIMEOUT_MS:30000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:120000}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

uniconnect:
  cors:
    allowed-origins: ${REST_ALLOWED_ORIGINS:}
  chat:
    allowed-origins: ${CHAT_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}
  verification:
    from: ${VERIFICATION_FROM:no-reply@uniconnect.local}
  password-reset:
    from: ${PASSWORD_RESET_FROM:${VERIFICATION_FROM:no-reply@uniconnect.local}}
