spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  application:
    name: uniconnect

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uniconnect}
    username: ${DB_USERNAME:uniconnect}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

uniconnect:
  chat:
    allowed-origins: ${CHAT_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}
  verification:
    from: ${VERIFICATION_FROM:no-reply@uniconnect.local}
    url: ${VERIFICATION_URL:http://localhost:3000/verify-email}
  password-reset:
    from: ${PASSWORD_RESET_FROM:${VERIFICATION_FROM:no-reply@uniconnect.local}}
    url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
