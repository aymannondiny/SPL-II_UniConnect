spring:
  config:
    activate:
      on-profile: dev

  # Use a direct Neon connection for Flyway migrations when configured. The
  # application datasource can continue using the pooled DB_URL endpoint.
  datasource:
    hikari:
      data-source-properties:
        tcpKeepAlive: true
        connectTimeout: 10
  flyway:
    url: ${FLYWAY_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/uniconnect}}
    user: ${FLYWAY_DB_USERNAME:${DB_USERNAME:uniconnect}}
    password: ${FLYWAY_DB_PASSWORD:${DB_PASSWORD:}}

uniconnect:
  cors:
    allowed-origins: ${REST_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
