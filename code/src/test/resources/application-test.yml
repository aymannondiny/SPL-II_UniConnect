# ============================================
# UNICONNECT - Test Configuration
# ============================================

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    hikari:
      auto-commit: true
      maximum-pool-size: 2

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
        jdbc:
          batch_size: 0

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 3025
    # Email will be MOCKED in tests

# JWT Test Configuration
app:
  jwt:
    secret: test-secret-key-for-integration-tests-must-be-at-least-256-bits-long-for-hmac-sha-algorithm-to-work-properly
    expiration: 3600000  # 1 hour
    refresh-expiration: 7200000  # 2 hours

  frontend:
    url: http://localhost:3000

  university:
    email-domain: iut-dhaka.edu
    name: Islamic University of Technology

  email:
    verification-url: http://localhost:8080/api/auth/verify-email?token=
    reset-password-url: http://localhost:8080/api/auth/reset-password?token=
    from: test@iut-dhaka.edu
    sender-name: UniConnect Test

# Logging for tests
logging:
  level:
    com.spl2.uniconnect: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
